<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
      Dark mode
    </button>
  </header>
  <div class="difficulty-picker">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div id="sudoku-board"></div>
  <div class="status-strip" aria-label="Game status">
    <span class="timer-meter">Time: <strong id="timer-value" aria-live="polite">00:00</strong></span>
    <span class="hint-meter">Hints used: <strong id="hint-count">0</strong></span>
  </div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Puzzle</button>
    <button id="hint-button">Hint</button>
    <span id="message" role="status" aria-live="polite"></span>
  </div>
  <form id="score-form" class="score-form" hidden>
    <label for="player-name">Enter your name for the leaderboard</label>
    <div class="score-form-fields">
      <input id="player-name" name="player-name" type="text" maxlength="40" required autocomplete="name">
      <button type="submit">Save Score</button>
    </div>
  </form>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10 Fastest Times</h2>
    <p id="leaderboard-empty">Complete a puzzle to claim a place.</p>
    <table id="leaderboard-table" hidden>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Player</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/leaderboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
